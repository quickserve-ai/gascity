description = """
Graph-first worktree lifecycle.

This is the built-in v2 workflow prototype for Gas City. It models work as an
explicit DAG with:

- a durable `body` scope bead
- explicit worktree setup and teardown
- first-class step beads that can be routed independently
- continuation metadata for same-session execution

Use this as the opt-in replacement for hierarchy-first single-session formulas.
"""
formula = "mol-scoped-work"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "Base branch to branch from"
default = "main"

[vars.setup_command]
description = "Optional setup command (install deps, bootstrap tools)"
default = ""

[vars.typecheck_command]
description = "Optional typecheck command"
default = ""

[vars.lint_command]
description = "Optional lint command"
default = ""

[vars.build_command]
description = "Optional build command"
default = ""

[vars.test_command]
description = "Optional test command"
default = ""

[[steps]]
id = "load-context"
title = "Load context and inspect the assignment"
description = """
Prime the workspace, inspect the assigned work, and understand the current bead
metadata before doing anything destructive.

```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
gc bd show "$WORK_BEAD_ID"
gc bd show "$WORK_BEAD_ID" --json | jq '.[0].metadata'
gc mail inbox
```
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "body"
title = "Worktree body scope"
needs = ["workspace-setup", "preflight-tests", "implement", "self-review", "submit"]
description = """
Terminal latch for the main worktree body.

Normal work beads inside this scope can fail. Paired `scope-check` control
beads handle fail-fast skipping, close this bead with `gc.outcome=fail|pass`,
and allow teardown to proceed.
"""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "workspace-setup"
title = "Set up a worktree and branch"
needs = ["load-context"]
description = """
Ensure there is an isolated worktree for this work item.

```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -z "$WORKTREE" ]; then
  WORKTREE_PATH=$(pwd)/worktrees/"$WORK_BEAD_ID"
  git worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
  gc bd update "$WORK_BEAD_ID" --set-metadata work_dir="$WORKTREE_PATH"
  WORKTREE="$WORKTREE_PATH"
fi
cd "$WORKTREE"
{{setup_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "preflight-tests"
title = "Run preflight checks on the base branch"
needs = ["workspace-setup"]
description = """
Run the configured checks before implementation.

```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "implement"
title = "Implement the requested change"
needs = ["preflight-tests"]
description = """
Make the code changes for convoy `{{convoy_id}}` in the worktree. Commit focused changes
as needed and keep the branch scoped to this work.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "self-review"
title = "Review the diff and run verification"
needs = ["implement"]
description = """
Inspect the change and run verification commands.

```bash
git diff origin/{{base_branch}}...HEAD
{{typecheck_command}}
{{lint_command}}
{{build_command}}
{{test_command}}
git status
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "submit"
title = "Finalize the work item"
needs = ["self-review"]
description = """
Perform the city-specific finalization for this work item. Examples:

- push the branch and hand off to a reviewer
- close the original work bead
- update metadata for downstream systems

This is intentionally generic so cities can opt into the graph contract
without inheriting Gastown's exact human workflow.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "cleanup-worktree"
title = "Clean up the worktree"
needs = ["body"]
description = """
Remove the temporary worktree after the body reaches terminal state.

The body reaching a terminal state does not mean the work is finished with its
tree. After a hand-off submit the work bead is still open and its convoy still
live, and the tree can be a running session's working directory. So the step
first DECLINES (ga-6xehc5): while the work bead is not closed, the convoy is
not closed, and work_dir names a tree that exists and is not empty, nothing is
rescued or removed and work_dir is kept. The decline comments once on the work
bead (a repeat decline for the same tree does not comment again), emits a
`mol-scoped-work.cleanup-declined` event, and stops with a line beginning
`DECLINED:`. Close a declined step as a HARD failure (gc.outcome=fail,
gc.failure_class=hard, gc.failure_reason set to that line): attempts run back
to back, so a retry sees the same state, and the retry runner has no outcome
for "not an attempt". A status or tree that cannot be read counts as in use,
so the step stops rather than tears down.

The worktree may hold the only copy of the work: uncommitted edits, untracked
files, or commits on a detached HEAD that no ref reaches. Teardown therefore
SECURES LOCALLY FIRST and removes second (ga-w805wc):

1. `gc worktree rescue` snapshots everything that is not gitignored into
   refs/rescue/<bead> in the repository's shared ref store, which removing the
   worktree cannot touch. It contacts no remote, moves no branch, runs no
   hook, and leaves out only what gc provably put in the tree.
2. The bead records where the work went (rescue_ref, rescue_sha, rescue_repo,
   rescue_taint) BEFORE anything is removed, so it swaps one pointer for
   another and never forgets.
3. `gc worktree teardown` rescues again and removes the tree only if the
   result is exactly the recorded rescue. It refuses a main checkout, a
   submodule, or any directory that is not a registered linked worktree.
4. Only then is work_dir cleared.

Every failure stops the step with the worktree and work_dir intact; the retry
policy surfaces a repeated failure. Run the block as written: each line is a
safety step, not a suggestion. To restore rescued work:
`git -C <rescue_repo> worktree add <dir> <rescue_sha>`.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json) || exit 1
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
# A failed read must stop the step: an empty work_dir from a failed read would
# look like "nothing to tear down" and erase the pointer to a live worktree.
BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json) || exit 1
WORKTREE=$(printf '%s' "$BEAD_JSON" | jq -er '.[0].metadata.work_dir // ""') || exit 1
if [ -z "$WORKTREE" ]; then
  echo "cleanup-worktree: $WORK_BEAD_ID records no work_dir; nothing to tear down"
  exit 0
fi
# Decline while the work may still be in use. A failed status read stops the
# step; only a closed bead or a closed convoy lets teardown go ahead.
BEAD_STATE=$(printf '%s' "$BEAD_JSON" | jq -er '.[0].status | strings') || exit 1
CONVOY_STATE=$(printf '%s' "$CONVOY_STATUS" | jq -er '.convoy.status | strings') || exit 1
# The tree is in use unless ls proves it empty or absent (ENOENT); an
# unreadable tree counts as in use. gc worktree rescue --absent-ok, not this
# probe, still decides whether an absent tree's pointer may be cleared.
TREE_LS=$(LC_ALL=C command ls -A -- "$WORKTREE" 2>&1)
TREE_RC=$?
TREE_IN_USE=yes
if [ "$TREE_RC" -eq 0 ] && [ -z "$TREE_LS" ]; then
  TREE_IN_USE=no
elif [ "$TREE_RC" -ne 0 ]; then
  case "$TREE_LS" in
    *": No such file or directory") TREE_IN_USE=no ;;
  esac
fi
if [ "$BEAD_STATE" != "closed" ] && [ "$CONVOY_STATE" != "closed" ] && [ "$TREE_IN_USE" = "yes" ]; then
  DECLINED="DECLINED: work bead $WORK_BEAD_ID open with live convoy {{convoy_id}}; worktree preserved"
  NOTE_HEAD="cleanup-worktree declined to tear down $WORKTREE:"
  # A failed lookup is not proof the comment is missing: skip it, still decline.
  COMMENTS=$(gc bd comments "$WORK_BEAD_ID" --json) &&
    SEEN=$(printf '%s' "$COMMENTS" | jq -r --arg head "$NOTE_HEAD" 'any((. // [])[]; (.text // "") | startswith($head))') ||
    SEEN=unknown
  if [ "$SEEN" = "false" ]; then
    gc bd comment "$WORK_BEAD_ID" "$NOTE_HEAD work bead $WORK_BEAD_ID is $BEAD_STATE and convoy {{convoy_id}} is $CONVOY_STATE, so the tree may still be in use. No rescue, no teardown; work_dir is kept." || echo "cleanup-worktree: could not comment on $WORK_BEAD_ID" >&2
  elif [ "$SEEN" != "true" ]; then
    echo "cleanup-worktree: could not read comments on $WORK_BEAD_ID; not commenting" >&2
  fi
  gc event emit mol-scoped-work.cleanup-declined --subject "$WORK_BEAD_ID" --message "$DECLINED" --payload "$(jq -cn --arg bead "$WORK_BEAD_ID" --arg convoy "{{convoy_id}}" --arg worktree "$WORKTREE" '{bead: $bead, convoy: $convoy, worktree: $worktree}')"
  echo "$DECLINED" >&2
  exit 1
fi
# Whether the worktree is gone is decided by gc (ENOENT only): a shell
# existence test also reads an UNREADABLE path as absent and would clear the
# pointer to a live worktree.
RESCUE=$(gc worktree rescue --path "$WORKTREE" --bead "$WORK_BEAD_ID" --absent-ok --json) || {
  echo "cleanup-worktree: REFUSING to remove $WORKTREE: its work could not be secured for $WORK_BEAD_ID" >&2
  exit 1
}
ABSENT=$(printf '%s' "$RESCUE" | jq -r '.absent == true') || exit 1
if [ "$ABSENT" = "true" ]; then
  echo "cleanup-worktree: $WORKTREE is already gone; clearing work_dir"
else
  RESCUE_REF=$(printf '%s' "$RESCUE" | jq -er '.rescue_ref') || exit 1
  RESCUE_SHA=$(printf '%s' "$RESCUE" | jq -er '.rescue_sha') || exit 1
  RESCUE_REPO=$(printf '%s' "$RESCUE" | jq -er '.repo') || exit 1
  RESCUE_TAINT=$(printf '%s' "$RESCUE" | jq -er '(.taint // []) | join(",")') || exit 1
  gc bd update "$WORK_BEAD_ID" --set-metadata rescue_ref="$RESCUE_REF" --set-metadata rescue_sha="$RESCUE_SHA" --set-metadata rescue_repo="$RESCUE_REPO" --set-metadata rescue_taint="$RESCUE_TAINT" || exit 1
  gc worktree teardown --path "$WORKTREE" --bead "$WORK_BEAD_ID" --rescue-sha "$RESCUE_SHA" || exit 1
fi
gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir || exit 1
```
"""
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "body", "gc.scope_role" = "teardown" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"
