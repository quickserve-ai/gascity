description = """
Detect and clean stale Dolt databases and orphan Dolt processes.

After claiming this vapor wisp, run:

```bash
gc bd formula show mol-dog-stale-db --json
```

Follow the step descriptions in order. When finished, close this bead, then run:

```bash
gc runtime drain-ack
```

The drain-ack tells the controller this session is done.

This formula shells out to `gc dolt-cleanup --json`, parses the
`gc.dolt.cleanup.v1` envelope, and emits one summary line per stage
to `gc events` so operators skimming a long scrollback can spot
trends. The full JSON report is appended to the work bead so a
follow-up reader can `bd show <id>` to see details.

## Dog Contract

This is infrastructure work. You:
1. Run a dry-run `gc dolt-cleanup --json --probe` scan.
2. Decide: no work -> report, at/below stale-DB threshold -> apply, above threshold -> escalate.
3. Apply with `gc dolt-cleanup --json --probe --force` only when safe.
4. Report findings, send optional maintenance notices if configured, exit.
5. Return to kennel.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| max_orphans_for_sql | formula default | Max stale dropped databases before escalating instead of forcing (default 20) |
| warn_threshold | formula default | Orphan count that triggers a warning maintenance notice (default 5) |
| protected_warn_threshold | formula default | Non-baseline (excludes active-rig) protected process count that triggers a separate warning maintenance notice (default 10) |

## Safety

`gc dolt-cleanup` resolves the Dolt port via the AD-04 chain
(--port flag > city dolt.port > <rigRoot>/.beads/dolt-server.port >
legacy 3307). Invalid explicit ports and unreadable or invalid rig
port files fail closed; only absent rig port files can reach the
legacy default. It cross-references registered rigs (HQ-first) and
will not drop any database whose name matches a registered rig DB,
nor any Dolt internals (`information_schema`, `mysql`,
`dolt_cluster`, `__gc_probe`). Orphan-process kills are restricted
to processes whose `--config` path lives under the test-config
allowlist (`/tmp/Test*`, `os.TempDir()/Test*`, `~/.gotmp/Test*`).
Database identifiers used for destructive DROP and purge calls must
contain only ASCII letters, digits, underscores, and non-leading
hyphens; rigs with other `dolt_database` names should be renamed or
handled manually so the cleanup can stay SQL-injection safe.

The apply branch treats a non-zero `gc dolt-cleanup --probe --force`
exit as an operator escalation. Do not retry from this formula with
the separate `gc dolt cleanup --server-down-ok` fallback; that is a
TTY-only human action after independently verifying the dolt server
process is stopped and the port is closed.

The runtime work is intentionally one formula step. Formula steps are
separate agent interactions, so scan, decision, apply, and report state
must stay inside one shell execution instead of relying on variables to
cross step boundaries."""
formula = "mol-dog-stale-db"
phase = "vapor"

[vars]
[vars.max_orphans_for_sql]
description = "Maximum stale dropped database count the formula auto-applies; above this, it escalates instead"
default = "20"

[vars.warn_threshold]
description = "Orphan count that triggers a warning maintenance notice"
default = "5"

[vars.protected_warn_threshold]
description = "Non-baseline (non-active-rig) protected process count that triggers a separate warning maintenance notice"
default = "10"

[[steps]]
id = "cleanup"
title = "Scan, decide, apply, and report stale Dolt cleanup"
description = """
Run this as one shell script so every derived value remains in the same process:

```bash
set -euo pipefail

# The drain-ack trap goes in before anything that can exit, so every exit
# below, including a failed hook lookup or mktemp, still returns the dog.
DRAIN_ACKED=0
TMP_DIR=""
cleanup() {
  # drain-ack first, and nothing in here can stop the trap: a temp dir that
  # will not delete must not keep the dog from being returned
  if [ "$DRAIN_ACKED" -ne 1 ]; then
    gc runtime drain-ack || true
  fi
  if [ -n "$TMP_DIR" ]; then
    rm -rf "$TMP_DIR" || true
  fi
}
trap cleanup EXIT

# platform_failure: a failure that no ownership refusal explains. Nothing
# refused this dog, so it is not the stranded-bead case a human must close by
# hand: it goes to the store-error route (GC_STORE_ERROR_RECIPIENT, a platform
# seat), the event stream and the maintenance nudge, never as a HIGH refusal,
# and exits non-zero (the trap drain-acks). The bead stays open for the next
# firing. $1 is the event's short name (store-unresolved, close-failed).
# With no store-error route set, one plain infrastructure mail goes to the
# escalation recipient instead: an event and an unset nudge reach nobody, and
# a failure that recurs every firing with nobody told is the re-dispatch loop
# this formula fails loudly to prevent (we-m34w5; ga-w8ptue, 2026-11-21: no
# city had set the route). It is a direct mail, not send_escalation, because
# this runs before the escalation script is resolved below.
platform_failure() {
  local kind="$1"
  local subject="$2"
  local message="$3"
  echo "$message" >&2
  if [ -n "${GC_STORE_ERROR_RECIPIENT:-}" ]; then
    gc mail send "$GC_STORE_ERROR_RECIPIENT" -s "$subject" \
      -m "${message}. Not an ownership refusal. The bead stays open and the next firing's dog retries." \
      || echo "send ${kind} notice failed; continuing to drain-ack" >&2
  else
    gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "$subject" \
      -m "${message}. Not an ownership refusal: an infrastructure failure, sent here because no store-error route (GC_STORE_ERROR_RECIPIENT) is set. Nothing to close by hand: the bead stays open and the next firing's dog retries." \
      || echo "send ${kind} notice failed; continuing to drain-ack" >&2
  fi
  gc event emit "mol-dog-stale-db.${kind}" --message "$message" \
    || echo "emit ${kind} event failed; continuing to drain-ack" >&2
  if [ -n "${GC_MAINTENANCE_DONE_TARGET:-}" ]; then
    gc session nudge "$GC_MAINTENANCE_DONE_TARGET" "MAINTENANCE_WARN: stale-db ${message}" || true
  fi
  if gc runtime drain-ack; then DRAIN_ACKED=1; fi # drain-ack before failing open; on failure the trap tries again
  exit 1
}

# store_unresolved: this run could not reach the bead store it was given
# (ga-w8ptue).
store_unresolved() {
  platform_failure store-unresolved "$1" "$2"
}

# Run from the work bead's store root, never from wherever this shell happens
# to stand: a bare `bd` resolves its store by walking up from the cwd, and
# seats carry GC_CITY_PATH but not BEADS_DIR. A dog that ran this script from
# a temp dir got "no beads database found" on its note and its close, and the
# close failure went to a human as a HIGH refusal (ga-w8ptue).
#
# The root is the rig root when gc set one (it sets GC_RIG_ROOT empty for a
# city-scoped session), else the FIRST city selector that is set, in gc's own
# order: GC_CITY, GC_CITY_PATH, GC_CITY_ROOT (resolveExplicitCityPathEnv). It
# must be an absolute path: a relative value is either a path relative to a
# cwd this script does not trust, or (GC_CITY) a registered city NAME that only
# gc's registry resolves, so the run stops rather than guess which city gc
# means. The root is used as given: if it holds no .beads store, or cannot be
# entered, the run stops as store-unresolved, before any cleanup, rather than
# fall back to another store or to the cwd. With none of the four set, the
# cwd is the only store hint, and it stays.
STORE_ROOT=""
if [ -n "${GC_RIG_ROOT:-}" ]; then
  STORE_ROOT="$GC_RIG_ROOT"
else
  for candidate in "${GC_CITY:-}" "${GC_CITY_PATH:-}" "${GC_CITY_ROOT:-}"; do
    if [ -n "$candidate" ]; then
      STORE_ROOT="$candidate"
      break
    fi
  done
fi
if [ -n "$STORE_ROOT" ]; then
  case "$STORE_ROOT" in
    /*) ;;
    *) store_unresolved "stale-db: cannot resolve the store root '${STORE_ROOT}'" \
         "store root selector '${STORE_ROOT}' is not an absolute path (a city name or a relative path); only gc resolves it; nothing was scanned or cleaned" ;;
  esac
  if [ ! -d "$STORE_ROOT/.beads" ]; then
    store_unresolved "stale-db: no bead store at ${STORE_ROOT}" \
      "store root ${STORE_ROOT} holds no .beads store; nothing was scanned or cleaned"
  fi
  if ! cd "$STORE_ROOT"; then
    store_unresolved "stale-db: cannot enter ${STORE_ROOT}" \
      "cannot enter store root ${STORE_ROOT}; nothing was scanned or cleaned"
  fi
fi

WORK_BEAD="${GC_BEAD_ID:-${GC_TRIGGER_BEAD_ID:-$(gc hook current --id-only)}}"
[ -n "$WORK_BEAD" ] || { echo "cannot resolve work bead id: GC_BEAD_ID/GC_TRIGGER_BEAD_ID unset and gc hook current returned nothing; aborting" >&2; exit 1; }
TMP_DIR=$(mktemp -d "${TMPDIR:-/tmp}/dolt-cleanup.XXXXXX")

SCAN_FILE="$TMP_DIR/scan.json"
APPLY_FILE="$TMP_DIR/apply.json"

append_report_note() {
  local title="$1"
  local file="$2"
  if [ -s "$file" ]; then
    if ! bd update "$WORK_BEAD" --append-notes "$(printf '## %s %s\n\n```json\n%s\n```' "$title" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" "$(cat "$file")")"; then
      echo "failed to append ${title} report; continuing to drain-ack" >&2
    fi
  fi
}

run_or_warn() {
  local label="$1"
  shift
  if ! "$@"; then
    echo "${label} failed; continuing to drain-ack" >&2
  fi
}

resolve_escalate_script() {
  local candidate
  local pack
  local city_path="${GC_CITY_PATH:-${GC_CITY:-.}}"
  local system_packs="${GC_SYSTEM_PACKS_DIR:-$city_path/.gc/system/packs}"
  if [ -n "${GC_ESCALATE_SCRIPT:-}" ]; then
    printf '%s\n' "$GC_ESCALATE_SCRIPT"
    return
  fi
  for pack in ${GC_ESCALATE_SEARCH_PACKS:-gastown maintenance bd core}; do
    candidate="$system_packs/$pack/assets/scripts/escalate.sh"
    if [ -x "$candidate" ]; then
      printf '%s\n' "$candidate"
      return
    fi
  done
  printf '%s\n' ""
}

ESCALATE_SCRIPT="$(resolve_escalate_script)"

send_escalation() {
  local subject="$1"
  local message="$2"
  if [ -n "$ESCALATE_SCRIPT" ] && [ -x "$ESCALATE_SCRIPT" ]; then
    "$ESCALATE_SCRIPT" --subject "$subject" --message "$message"
    return
  fi
  gc mail send "${GC_ESCALATION_RECIPIENT:-human}" -s "$subject" -m "$message"
}

maintenance_notice() {
  local message="$1"
  local target="${GC_MAINTENANCE_DONE_TARGET:-}"
  [ -n "$target" ] || return 0
  gc session nudge "$target" "$message" || true
}

drain_ack_once() {
  if [ "$DRAIN_ACKED" -ne 1 ]; then
    gc runtime drain-ack
    DRAIN_ACKED=1
  fi
}

fail_open_after_drain() {
  local message="$1"
  echo "$message" >&2
  drain_ack_once # drain-ack before failing open
  exit 1
}

# close_work_bead presents the identity the claim was recorded under: bd's
# ownership guard compares the closer's actor against the assignee verbatim
# (we-m34w5). `gc hook --claim` picks that identity as GC_ALIAS, then
# GC_SESSION_ID, then BEADS_ACTOR, GC_AGENT and GC_SESSION_NAME
# (hookClaimAssigneeIdentity); this chain mirrors it. The session id must
# outrank BEADS_ACTOR: an unaliased pool dog — the shipped dog, with
# max_active_sessions and no namepool — claims under its session bead id
# while its BEADS_ACTOR is the slot name every occupant of that slot reuses,
# and presenting the slot name is refused. No identity resolved means no
# --actor flag — bd then applies its own actor chain. CLOSE_ACTOR stays set
# for the refusal report.
close_work_bead() {
  local reason="$1"
  CLOSE_ACTOR="${GC_ALIAS:-${GC_SESSION_ID:-${BEADS_ACTOR:-${GC_AGENT:-${GC_SESSION_NAME:-}}}}}"
  if [ -n "$CLOSE_ACTOR" ]; then
    bd close "$WORK_BEAD" --actor "$CLOSE_ACTOR" --reason "$reason"
  else
    bd close "$WORK_BEAD" --reason "$reason" # guard-ack:no-session-identity
  fi
}

if ! gc dolt-cleanup --json --probe > "$SCAN_FILE"; then
  append_report_note "scan (dry-run failed)" "$SCAN_FILE"
  run_or_warn "emit dry-run failure escalation" gc event emit mol-dog-stale-db.escalate \
    --message "dry-run failed before a valid cleanup decision; leaving work bead open"
  fail_open_after_drain "gc dolt-cleanup dry-run failed; leaving work bead open"
fi
if ! jq -e '.schema == "gc.dolt.cleanup.v1"' "$SCAN_FILE" >/dev/null; then
  append_report_note "scan (invalid JSON)" "$SCAN_FILE"
  run_or_warn "emit invalid dry-run JSON escalation" gc event emit mol-dog-stale-db.escalate \
    --message "dry-run returned invalid JSON; leaving work bead open"
  fail_open_after_drain "gc dolt-cleanup dry-run returned invalid JSON; leaving work bead open"
fi

ORPHAN_DBS=$(jq -r '.dropped.count // 0' "$SCAN_FILE")
ORPHAN_PROCS=$(jq -r '.reaped.targets | length' "$SCAN_FILE")
ORPHAN_TOTAL=$((ORPHAN_DBS + ORPHAN_PROCS))
DISK_BYTES=$(jq -r '.summary.bytes_freed_disk // .purge.bytes_reclaimed // 0' "$SCAN_FILE")
RSS_BYTES=$(jq -r '.summary.bytes_freed_rss // 0' "$SCAN_FILE")
SCAN_ERRS=$(jq -r '.summary.errors_total // 0' "$SCAN_FILE")
INVALID_DROP_SKIPS=$(jq -r '[.dropped.skipped[]? | select(.reason == "invalid-identifier")] | length' "$SCAN_FILE")
SCAN_FORCE_BLOCKERS=$(jq -r '[.force_blockers[]?] | length' "$SCAN_FILE")
# ga-xkc9mo: a 100%-protected leak (zero reap targets) must not collapse into
# an indistinguishable orphans:0 -- roll up the protected population
# separately. active-rig is the expected baseline (one live server per
# registered rig); everything else is a genuine unreapable leak.
PROTECTED_TOTAL=$(jq -r '.summary.protected_total // 0' "$SCAN_FILE")
PROTECTED_ACTIVE_RIG=$(jq -r '.summary.protected_by_kind["active-rig"] // 0' "$SCAN_FILE")
PROTECTED_NON_BASELINE=$((PROTECTED_TOTAL - PROTECTED_ACTIVE_RIG))

run_or_warn "emit scan event" gc event emit mol-dog-stale-db.scan \
  --message "$ORPHAN_DBS orphans (${DISK_BYTES} bytes), $ORPHAN_PROCS procs (${RSS_BYTES} bytes)" \
  --payload "$(jq -c '{dropped: .dropped.count, purge_bytes: .purge.bytes_reclaimed, procs: (.reaped.targets | length), rss_bytes: .summary.bytes_freed_rss, errors: .summary.errors_total, invalid_identifier_skips: ([.dropped.skipped[]? | select(.reason == "invalid-identifier")] | length), force_blockers: ([.force_blockers[]?] | length), protected_total: (.summary.protected_total // 0), protected_non_baseline: ((.summary.protected_total // 0) - (.summary.protected_by_kind["active-rig"] // 0))}' "$SCAN_FILE")"

append_report_note "scan (dry-run)" "$SCAN_FILE"

APPLIED=0
ESCALATED=0
DONE_BYTES=0
DONE_ERRS="$SCAN_ERRS"
DROP_OK=0
DROP_FAIL=0
PURGE_BYTES=0
MISSED_PURGE_BYTES=0
REAP_KILLED=0
REAP_TOTAL="$ORPHAN_PROCS"

if [ "$SCAN_ERRS" -gt 0 ] || [ "$INVALID_DROP_SKIPS" -gt 0 ] || [ "$SCAN_FORCE_BLOCKERS" -gt 0 ]; then
  ESCALATED=1
  run_or_warn "send dry-run error escalation" send_escalation \
    "ESCALATION: Dolt cleanup dry-run reported ${SCAN_ERRS} error(s), ${INVALID_DROP_SKIPS} invalid stale database identifier(s), ${SCAN_FORCE_BLOCKERS} force blocker(s)" \
    "Dry-run report attached to work bead. Operator review required before forcing cleanup."
  run_or_warn "emit dry-run error escalation" gc event emit mol-dog-stale-db.escalate \
    --message "dry-run reported ${SCAN_ERRS} error(s), ${INVALID_DROP_SKIPS} invalid stale database identifier(s), ${SCAN_FORCE_BLOCKERS} force blocker(s); leaving work bead open"
  fail_open_after_drain "gc dolt-cleanup dry-run reported ${SCAN_ERRS} error(s), ${INVALID_DROP_SKIPS} invalid stale database identifier(s), ${SCAN_FORCE_BLOCKERS} force blocker(s); leaving work bead open"
elif [ "$ORPHAN_TOTAL" -eq 0 ] && [ "$DISK_BYTES" -le 0 ]; then
  :
elif [ "$ORPHAN_DBS" -gt "{{max_orphans_for_sql}}" ]; then
  ESCALATED=1
  DONE_BYTES=$((DISK_BYTES + RSS_BYTES))
  run_or_warn "send max-orphan escalation" send_escalation \
    "ESCALATION: $ORPHAN_DBS stale Dolt databases exceed max_orphans_for_sql={{max_orphans_for_sql}}" \
    "Dry-run report attached to work bead. Operator review required before forcing cleanup."
  run_or_warn "emit max-orphan escalation" gc event emit mol-dog-stale-db.escalate \
    --message "$ORPHAN_DBS stale databases > max_orphans_for_sql={{max_orphans_for_sql}} -> escalation sent"
else
  if ! gc dolt-cleanup --json --probe --force --max-orphan-dbs "{{max_orphans_for_sql}}" > "$APPLY_FILE"; then
    ESCALATED=1
    append_report_note "apply (--force, failed)" "$APPLY_FILE"
    run_or_warn "send apply refusal escalation" send_escalation \
      "ESCALATION: gc dolt-cleanup apply refused [HIGH]" \
      "gc dolt-cleanup --probe --force refused. Do not retry from an agent. Operator must confirm dolt is stopped (process gone AND port closed), then use the separate gc dolt cleanup --server-down-ok fallback if appropriate."
    run_or_warn "emit apply refusal escalation" gc event emit mol-dog-stale-db.escalate \
      --message "apply refused; operator must verify dolt stopped before using gc dolt cleanup --server-down-ok"
    fail_open_after_drain "gc dolt-cleanup apply failed; leaving work bead open"
  fi
  if ! jq -e '.schema == "gc.dolt.cleanup.v1"' "$APPLY_FILE" >/dev/null; then
    append_report_note "apply (--force, invalid JSON)" "$APPLY_FILE"
    run_or_warn "emit invalid apply JSON escalation" gc event emit mol-dog-stale-db.escalate \
      --message "apply returned invalid JSON; leaving work bead open"
    fail_open_after_drain "gc dolt-cleanup apply returned invalid JSON; leaving work bead open"
  fi

  APPLY_ERRS=$(jq -r '.summary.errors_total // 0' "$APPLY_FILE")
  APPLY_MAX_ORPHAN_REFUSALS=$(jq -r '[.errors[]? | select((.kind // "") == "max-orphan-refusal" or (((.error // "" | ascii_downcase) | (contains("--max-orphan-dbs") or contains("max-orphan") or contains("orphan databases")) and (contains("refus") or contains("exceed")))))] | length' "$APPLY_FILE")
  if [ "$APPLY_ERRS" -gt 0 ] || [ "$APPLY_MAX_ORPHAN_REFUSALS" -gt 0 ]; then
    ESCALATED=1
    APPLY_REFUSAL_MESSAGE="apply reported ${APPLY_ERRS} error(s); leaving work bead open"
    if [ "$APPLY_MAX_ORPHAN_REFUSALS" -gt 0 ]; then
      APPLY_REFUSAL_MESSAGE="apply refused by max-orphan safety guard; leaving work bead open"
    fi
    append_report_note "apply (--force, refused)" "$APPLY_FILE"
    run_or_warn "send apply refusal escalation" send_escalation \
      "ESCALATION: gc dolt-cleanup apply refused [HIGH]" \
      "gc dolt-cleanup --probe --force refused or reported ${APPLY_ERRS} error(s). Do not retry from an agent. Operator must inspect the attached apply report before deciding whether any manual cleanup is appropriate."
    run_or_warn "emit apply refusal escalation" gc event emit mol-dog-stale-db.escalate \
      --message "$APPLY_REFUSAL_MESSAGE"
    fail_open_after_drain "gc dolt-cleanup ${APPLY_REFUSAL_MESSAGE}"
  fi

  DROP_OK=$(jq -r '.dropped.count // 0' "$APPLY_FILE")
  DROP_FAIL=$(jq -r '.dropped.failed | length' "$APPLY_FILE")
  PURGE_BYTES=$(jq -r '.purge.bytes_reclaimed // 0' "$APPLY_FILE")
  REAP_KILLED=$(jq -r '.reaped.count // 0' "$APPLY_FILE")
  REAP_TOTAL=$(jq -r '.reaped.targets | length' "$APPLY_FILE")
  DONE_ERRS=$(jq -r '.summary.errors_total // 0' "$APPLY_FILE")
  DONE_BYTES=$(jq -r '(.summary.bytes_freed_disk // 0) + (.summary.bytes_freed_rss // 0)' "$APPLY_FILE")
  if [ "$PURGE_BYTES" -lt "$DISK_BYTES" ]; then
    MISSED_PURGE_BYTES=$((DISK_BYTES - PURGE_BYTES))
    DONE_ERRS=$((DONE_ERRS + 1))
  fi
  APPLIED=1

  run_or_warn "emit drop event" gc event emit mol-dog-stale-db.drop \
    --message "${DROP_OK}/${ORPHAN_DBS} ok, ${DROP_FAIL} failed"

  PURGE_MESSAGE="${PURGE_BYTES} bytes reclaimed"
  if [ "$MISSED_PURGE_BYTES" -gt 0 ]; then
    PURGE_MESSAGE="${PURGE_MESSAGE} (${MISSED_PURGE_BYTES} bytes missed)"
  fi
  run_or_warn "emit purge event" gc event emit mol-dog-stale-db.purge \
    --message "$PURGE_MESSAGE"

  run_or_warn "emit reap event" gc event emit mol-dog-stale-db.reap \
    --message "${REAP_KILLED}/${REAP_TOTAL} procs killed"

  append_report_note "apply (--force)" "$APPLY_FILE"
fi

if [ "$APPLIED" -eq 1 ]; then
  DONE_MESSAGE="${DONE_BYTES} bytes freed; ${DONE_ERRS} errors"
else
  DONE_MESSAGE="${DONE_BYTES} bytes reclaimable; ${DONE_ERRS} errors"
fi

run_or_warn "emit done event" gc event emit mol-dog-stale-db.done \
  --message "$DONE_MESSAGE"

if [ "$APPLIED" -eq 1 ] && [ "$MISSED_PURGE_BYTES" -gt 0 ]; then
  ESCALATED=1
  run_or_warn "emit missed purge escalation" gc event emit mol-dog-stale-db.escalate \
    --message "apply missed ${MISSED_PURGE_BYTES} reclaimable bytes; leaving work bead open"
fi

if [ "$ORPHAN_TOTAL" -ge "{{warn_threshold}}" ]; then
  maintenance_notice "MAINTENANCE_WARN: $ORPHAN_TOTAL Dolt orphan(s) seen this scan (warn_threshold={{warn_threshold}})"
fi

if [ "$PROTECTED_NON_BASELINE" -ge "{{protected_warn_threshold}}" ]; then
  maintenance_notice "MAINTENANCE_WARN: $PROTECTED_NON_BASELINE non-baseline protected Dolt process(es) seen this scan (protected_warn_threshold={{protected_warn_threshold}}, protected_total=${PROTECTED_TOTAL})"
fi

maintenance_notice "MAINTENANCE_DONE: stale-db - orphans: ${ORPHAN_TOTAL}, applied: ${APPLIED}, escalated: ${ESCALATED}"

if [ "$APPLIED" -eq 1 ] && [ "$MISSED_PURGE_BYTES" -gt 0 ]; then
  fail_open_after_drain "gc dolt-cleanup apply missed ${MISSED_PURGE_BYTES} reclaimable bytes; leaving work bead open"
fi

# A refused terminal close must leave evidence, never a clean drain: under
# set -euo pipefail an unguarded failure aborts the script, the EXIT trap
# still drain-acks, and the controller re-dispatches a fresh agent against
# the still-open bead forever (we-m34w5: 15 wakes in ~40 minutes). Only an
# operator can finish this, so it escalates like every other operator path
# in this script, carrying bd's refusal — it names the assignee and the actor
# it compared — and the actor this run presented.
CLOSE_FILE="$TMP_DIR/close.log"
if ! close_work_bead "Stale DB scan complete (orphans=${ORPHAN_TOTAL}, applied=${APPLIED}, escalated=${ESCALATED})" > "$CLOSE_FILE" 2>&1; then
  cat "$CLOSE_FILE" >&2
  CLOSE_REFUSAL="$(tr '\n' ' ' < "$CLOSE_FILE")"
  # Classify the failure, the authority refusals FIRST (ga-7ws7gu). bd refuses
  # a close for authority in two texts (bd 1.3.1-fleet.20261005.1,
  # internal/validation/issue.go): the ownership guard, 'cannot close <id>:
  # assignee is "<A>", actor is "<B>"; reclaim or use --force to override',
  # and the deletion-protection flag, 'cannot modify pinned issue <id> (use
  # --force to override)'. Only someone with authority may --force past
  # either, so only these take the HIGH route below, and they are matched
  # before the availability texts so a refusal printed beside an unrelated
  # connection warning still reaches a person.
  # Next, bd could not find or reach its store (store_unresolved above): the
  # texts bd and gc print for a missing store, a Dolt server that cannot be
  # reached (seen live on 2026-11-18) and a connection lost mid-call (the
  # availability family internal/dispatch/control.go treats as retryable).
  # Anything else (a gate refusal, a template, no error text at all) is not
  # an ownership refusal either: it takes the platform route as close-failed,
  # never the human route with advice to close the bead by hand.
  case "$CLOSE_REFUSAL" in
    *'assignee is "'*'actor is "'*'reclaim or use --force'*|*'cannot modify pinned issue'*)
      ;;
    *"no beads database found"*|*"failed to open database"*|*"circuit breaker is open"*|*"server unreachable"*|*"connection refused"*|*"i/o timeout"*|*"bad connection"*|*"connection reset by peer"*)
      store_unresolved "stale-db: terminal close could not reach a bead store for ${WORK_BEAD}" \
        "terminal close for ${WORK_BEAD} could not reach a bead store from $(pwd): ${CLOSE_REFUSAL}"
      ;;
    *)
      platform_failure close-failed "stale-db: terminal close failed for ${WORK_BEAD}" \
        "terminal close for ${WORK_BEAD} failed, not an ownership refusal: ${CLOSE_REFUSAL:-no error text}"
      ;;
  esac
  CLOSE_REFUSAL_MESSAGE="terminal close refused for ${WORK_BEAD} (actor presented: ${CLOSE_ACTOR:-none}): ${CLOSE_REFUSAL:-no error text}"
  run_or_warn "send close-refused escalation" send_escalation \
    "ESCALATION: stale-db terminal close refused for ${WORK_BEAD} [HIGH]" \
    "${CLOSE_REFUSAL_MESSAGE}. The bead is still open behind a drained session, so the controller re-dispatches a fresh dog on every firing until it is closed by hand with the assignee identity: bd show ${WORK_BEAD}, then bd close ${WORK_BEAD} --actor <assignee>."
  run_or_warn "emit close-refused escalation" gc event emit mol-dog-stale-db.escalate \
    --message "${CLOSE_REFUSAL_MESSAGE}; leaving work bead open — close it by hand with the assignee identity"
  maintenance_notice "MAINTENANCE_ESCALATE: stale-db terminal close REFUSED for ${WORK_BEAD}; an open bead behind a clean drain re-dispatches forever"
  fail_open_after_drain "${CLOSE_REFUSAL_MESSAGE}; leaving work bead open"
fi
cat "$CLOSE_FILE"
drain_ack_once # drain-ack before normal exit
exit
